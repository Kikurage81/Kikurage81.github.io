<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打刻 | 勤怠</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  .card { max-width: 560px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
  label { display:block; margin: 12px 0 4px; }
  button { padding: 10px 16px; margin-right: 8px; }
  .ok { color: #0a7; }
  .err { color: #c00; }
</style>
<div class="card">
  <h1>打刻</h1>
  <label>ユーザー</label>
  <select id="user"></select>

  <label>備考（任意）</label>
  <input id="note" placeholder="客先直行 / 早退 など" style="width:100%;padding:8px;">

  <div style="margin-top:12px">
    <button id="inBtn">出勤</button>
    <button id="outBtn">退勤</button>
  </div>

  <p id="msg"></p>
  <hr>
  <p><a href="./admin.html">全員の勤怠を見る</a></p>
</div>

<script>
  // ===== 設定 =====
  const API = 'https://script.google.com/macros/s/AKfycbx5uqTUlPz_C_VJQdbbU1IjBv86QcyFs8Tplp5-VJsdGz3LpiM8yfqMCWmvDBcpEEcg/exec';
  // 社員5人分の "表示名:個別トークン" を管理者だけが埋めてください
  const USERS = {
    'むぎちゃ':'e9baff02e4c20406fc8e02ae109ed03c5f04035cc1e6696c8227818ddf19c4a0',
    'きくらげ':'d36bc8945ab1cc833b29428a66dc8dd6fb6676824eb67c32ff13cb19cd5e0bbb',
    'まさくん':'c4c0c3ad88d846cbb24613189165607be02278a40a65f8ebf8185261b8983cb5',
    'かがちゃ':'bd7c5f3f4b0a034257ed4b8549340180ddbfc2a5183b2aff0cf50a90b8ac5d45',
    'けいた':'d6ae78ecaac55e00e10a7a7b62e9eac068ebe4b18e8c3d26bef283c4751c7b16',
    'こめ':'2067e7db73a52c9f4af0d116783deba162471ca4353c66204a72802f78beb9e0',
    'なまはむ':'014c08fe9b0b7643bcc652bf681979e277eec60512f8ed4a7ad28767e53c701a',
    'じろ':'a7ce3d38b4b807ca73d240a152752469dcd0d03017d4ade50409af17cfe362da',
    'とまきち':'f0d301b8bf44fab5549a51c06bbb8555b42fc2674e0532d289bb5f7dda663b1c',
  };
  // ===============

  const userSel = document.getElementById('user');
  const noteEl = document.getElementById('note');
  const msg = document.getElementById('msg');

  // ユーザー選択を構築
  for (const name of Object.keys(USERS)) {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    userSel.appendChild(opt);
  }
  // 前回選択を復元
  const saved = localStorage.getItem('kintai_user');
  if (saved && USERS[saved]) userSel.value = saved;
  userSel.addEventListener('change', ()=> localStorage.setItem('kintai_user', userSel.value));

  async function clock(action) {
    const user = userSel.value;
    if (!user) return show('ユーザーを選んでください', true);
    const token = USERS[user];

    const body = { user, action, note: noteEl.value || '', token };
    const url = API; // POST /exec
    try {
      disable(true);
      const res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'unknown');
      show(`✅ ${action==='in'?'出勤':'退勤'}しました (${data.timestamp})`);
      noteEl.value = '';
    } catch (e) {
      show('エラー: ' + e.message, true);
    } finally {
      disable(false);
    }
  }
  function show(text, isErr=false){ msg.textContent = text; msg.className = isErr?'err':'ok'; }
  function disable(b){ inBtn.disabled=outBtn.disabled=b; }

  const inBtn = document.getElementById('inBtn');
  const outBtn = document.getElementById('outBtn');
  inBtn.onclick = ()=> clock('in');
  outBtn.onclick = ()=> clock('out');
</script>
</html>
